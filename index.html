<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Permohonan Rumah Ibadat Bukan Islam</title>
<style>
:root{--bg:#f6f2ee;--card:#fff;--tx:#1f1a17;--mu:#5f564f;--bd:#e6ded6;--ac:#1d5fd1;--ok:#1b7a43;--no:#b3261e;--wa:#8a5200;--gr:#6b625b;--hd:#7d1212}
@media (prefers-color-scheme:dark){:root{--bg:#14110f;--card:#201b18;--tx:#efe8e2;--mu:#b3a89f;--bd:#3a322d;--ac:#6ea0f5;--ok:#4cc27a;--no:#ef7a6c;--wa:#e6a23c;--gr:#a69b92;--hd:#6a1010;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1280px;margin:0 auto;padding:0 32px}
.hd{background:var(--hd);color:#fff}
.hdi{display:flex;align-items:center;gap:20px;padding-top:22px;padding-bottom:22px}
.logo{width:100px;height:100px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:8px}
.logo img{width:100%;height:100%;object-fit:contain}
.kn{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.ukt{font-family:'Source Serif 4',Georgia,serif;font-size:36px;font-weight:700;line-height:1.15;margin-top:2px}
.main{padding-top:28px;padding-bottom:48px}
h1{font-size:22px;line-height:1.3;margin:0}.sub{color:var(--mu);font-size:14px;margin:4px 0 22px}.sub a{color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 20px}
.kpi b{display:block;font-size:34px;line-height:1.1}.kpi span{color:var(--mu);font-size:13px}
.bar{height:14px;border-radius:7px;background:var(--bd);margin:14px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.r3{display:grid;grid-template-columns:1fr 440px;gap:12px;margin-top:12px}
.lc{display:grid;gap:12px;grid-template-rows:auto 1fr}
.agh{color:var(--mu);font-size:12px;margin:2px 0 8px}
.ag{display:grid;grid-template-columns:86px 1fr 92px;gap:12px;align-items:center;padding:7px 0;font-size:13px}
.ag .tr{height:10px;background:var(--bd);border-radius:5px;overflow:hidden}
.ag .tr i{display:block;height:100%}
.ag i.g{background:var(--ok)}.ag i.a{background:#c77a00}.ag i.r{background:var(--no)}
.ag span{text-align:right;color:var(--mu)}.ag span b{color:var(--tx)}
@media (max-width:900px){.r3{grid-template-columns:1fr}}
.m{font-size:11px;color:var(--mu);max-width:170px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500}
.chip b{background:var(--card);border-radius:99px;padding:1px 8px;font-size:12px}
.chip.hot{background:#fbe3e0;color:#8f1d12}.chip.hot b{color:#8f1d12}
.chip.ok{color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 12px}
select,input{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.wrap{overflow-x:auto;padding:8px 14px}table{border-collapse:collapse;width:100%;min-width:1040px;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);text-align:left;padding:10px 8px;border-bottom:2px solid var(--bd)}
td{padding:12px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.c{text-align:center;font-weight:700}
.s0{color:var(--gr);font-weight:500}.s1{color:var(--ok)}.s2{color:var(--no)}.s3{color:var(--wa)}
.tj{color:var(--mu);font-size:12px;margin-top:3px;min-width:260px;max-width:420px}
.note{color:var(--mu);font-size:12px;margin-top:12px}
#err{display:none;background:#fdecea;color:#8a1c12;border:1px solid #f5b5ae;border-radius:8px;padding:10px;margin-bottom:12px}
@media (max-width:640px){.w{padding:0 16px}.ukt{font-size:26px}.logo{width:72px;height:72px}}
@media print{.tools{display:none}table{min-width:0}.hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<header class="hd"><div class="w hdi">
<div class="logo"><img src="jata_melaka.png" alt="Jata Negeri Melaka"></div>
<div style="flex:1"><div class="kn">Kerajaan Negeri Melaka</div><div class="ukt">Unit Kerajaan Tempatan</div></div>
</div></header>
<div class="w main">
<div id="err"></div>
<h1 id="h"></h1>
<div class="sub" id="sub"></div>
<div class="grid" id="kpi"></div>
<div class="r3"><div class="lc">
<div class="card"><b>Kemajuan maklum balas agensi</b><div class="bar"><i id="prog"></i></div><div id="progt" style="font-size:13px;color:var(--mu)"></div></div>
<div class="card"><b>Agensi yang belum beri maklum balas</b><div class="chips" id="pend"></div></div>
</div>
<div class="card"><b>Maklum balas mengikut agensi</b><div class="agh" id="agh"></div><div id="agl"></div></div>
</div>
<div class="tools">
  <select id="fs"><option value="">Semua status</option></select>
  <select id="fa"><option value="">Semua daerah</option></select>
  <input id="q" placeholder="Cari organisasi / tajuk…" style="flex:1;min-width:140px">
</div>
<div class="card wrap"><table id="t"></table></div>
<div class="note">Kod: &#10003; Sudah beri maklum balas &nbsp; &#10007; Tidak sokong &nbsp; &#9888; Bersyarat &nbsp; &ndash; Belum beri. <span id="rule"></span></div>

</div>
<script src="config.js"></script>
<script>
function $(i){return document.getElementById(i)}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var PERMOHONAN=[],AGENSI=[];
function fail(m){$("err").textContent=m;$("err").style.display="block"}
function csv(t){var R=[],r=[],f="",q=false,i=0,c;t=t.replace(/^\uFEFF/,"");
for(;i<t.length;i++){c=t.charAt(i);
 if(q){if(c==='"'){if(t.charAt(i+1)==='"'){f+='"';i++}else q=false}else f+=c}
 else if(c==='"')q=true;
 else if(c===","){r.push(f);f=""}
 else if(c==="\n"){r.push(f);R.push(r);r=[];f=""}
 else if(c!=="\r")f+=c}
if(f!==""||r.length){r.push(f);R.push(r)}
return R}
function parse(t){
  var R=csv(t).filter(function(r){return r.some(function(c){return c.trim()})});
  if(R.length<2)throw 0;
  var H=R[0].map(function(x){return x.trim()}),ki=H.length-1,j;
  for(j=0;j<H.length;j++){if(/keputusan/i.test(H[j]))ki=j}
  AGENSI=H.slice(4,ki).filter(function(x){return x});
  PERMOHONAN=R.slice(1).filter(function(r){return (r[1]||"").trim()}).map(function(r){
    var o={nama:r[1].trim(),daerah:(r[2]||"").trim(),tajuk:(r[3]||"").trim(),sudah:[],tidak:[],bersyarat:[],keputusan:""};
    var k=(r[ki]||"").trim().toLowerCase();if(k==="lulus"||k==="tolak")o.keputusan=k;
    for(var j=4;j<ki;j++){var v=(r[j]||"").trim().toUpperCase();if(!v||!H[j])continue;
      if(v==="X"||v==="\u2717"||v==="TIDAK")o.tidak.push(H[j]);
      else if(v==="S"||v==="B"||v==="\u26A0"||v==="SYARAT")o.bersyarat.push(H[j]);
      else o.sudah.push(H[j])}
    return o});
}
function load(){
  if(typeof SHEET_URL==="undefined"){fail("Fail config.js tidak dapat dibaca. Semak: (1) config.js ada di GitHub bersama index.html, (2) pautan berada di antara tanda petikan \" \" dan baris berakhir dengan ;");return}
  SHEET_URL=SHEET_URL.trim();
  if(SHEET_URL.indexOf("TAMPAL")===0){fail("Pautan Google Sheets belum diisi dalam config.js.");return}
  if(SHEET_URL.indexOf("https://docs.google.com/")!==0){fail("Pautan dalam config.js bukan pautan Google Sheets. Ia mesti bermula dengan https://docs.google.com/ dan diambil daripada Publish to web (CSV).");return}
  fetch(SHEET_URL+(SHEET_URL.indexOf("?")<0?"?":"&")+"t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()})
  .then(function(t){parse(t);start()})
  .catch(function(){fail("Data tidak dapat dibaca daripada Google Sheets. Semak pautan dalam config.js dan pastikan helaian sudah di-Publish to web (format CSV).")});
}
load();
function start(){
var SY=["–","✓","✗","⚠"];
var ST={menunggu:["Menunggu Maklum Balas","var(--wa)"],sedia:["Sedia Mesyuarat","var(--ac)"],lulus:["Diluluskan","var(--ok)"],tolak:["Ditolak","var(--no)"]};
function has(l,a){return !!l&&l.indexOf(a)>=0}
function sv(r,a){return has(r.tidak,a)?2:has(r.bersyarat,a)?3:has(r.sudah,a)?1:0}
var MINX=(typeof MINIMUM!=="undefined")?MINIMUM:8,TW=(typeof TIDAK_WAJIB!=="undefined")?TIDAK_WAJIB:["IPK","BOMBA"];
function wm(r){return AGENSI.filter(function(a){return !has(TW,a)&&sv(r,a)===0})}
function stat(r){if(r.keputusan)return r.keputusan;var g=AGENSI.filter(function(a){return sv(r,a)>0}).length;return (g>=MINX&&wm(r).length===0)?"sedia":"menunggu"}
$("h").textContent=TAJUK;document.title=TAJUK;
$("sub").innerHTML="Data dibaca daripada Google Sheets pada "+new Date().toLocaleString("ms-MY")+" &middot; <a href=\"#\" onclick=\"location.reload();return false\">Muat semula</a>";
Object.keys(ST).forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=ST[k][0];$("fs").appendChild(o)});
var ds=[];PERMOHONAN.forEach(function(r){if(ds.indexOf(r.daerah)<0)ds.push(r.daerah)});
ds.forEach(function(d){var o=document.createElement("option");o.value=d;o.textContent=d;$("fa").appendChild(o)});
function render(){
  $("rule").textContent="Sedia Mesyuarat: sekurang-kurangnya "+MINX+"/"+AGENSI.length+" agensi sudah menjawab dan semua agensi wajib sudah menjawab. * Tidak wajib: "+TW.join(", ")+".";
  var c={menunggu:0,sedia:0,lulus:0,tolak:0},tot=PERMOHONAN.length||1;
  PERMOHONAN.forEach(function(r){c[stat(r)]++});
  $("kpi").innerHTML='<div class="card kpi"><b>'+PERMOHONAN.length+'</b><span>Jumlah permohonan</span></div>'+
   Object.keys(ST).map(function(k){return '<div class="card kpi"><b style="color:'+ST[k][1]+'">'+c[k]+'</b><span>'+ST[k][0]+'</span></div>'}).join("");
  var got=0,all=PERMOHONAN.length*AGENSI.length;PERMOHONAN.forEach(function(r){AGENSI.forEach(function(a){if(sv(r,a)>0)got++})});
  var pc=all?Math.round(got/all*100):0;$("prog").style.width=pc+"%";$("progt").textContent=got+" daripada "+all+" maklum balas diterima ("+pc+"%)";
  $("pend").innerHTML=AGENSI.map(function(a){return {a:a,n:PERMOHONAN.filter(function(r){return !r.keputusan&&sv(r,a)===0}).length}}).sort(function(x,y){return y.n-x.n}).map(function(o){return '<span class="chip'+(o.n===0?' ok':(!has(TW,o.a)||o.n<Math.ceil(PERMOHONAN.length*0.8))?'':' hot')+'">'+esc(o.a)+(has(TW,o.a)?'':'*')+' <b>'+o.n+'</b></span>'}).join("");
  var tot=PERMOHONAN.length;$("agh").textContent="Peratus daripada "+tot+" permohonan yang sudah dijawab";
  $("agl").innerHTML=AGENSI.map(function(a){var n=PERMOHONAN.filter(function(r){return sv(r,a)>0}).length;return {a:a,n:n,pc:tot?Math.round(n/tot*100):0}}).sort(function(x,y){return y.pc-x.pc}).map(function(o){return '<div class="ag"><b>'+esc(o.a)+(has(TW,o.a)?'':'*')+'</b><div class="tr"><i class="'+(o.pc>=70?'g':o.pc>=40?'a':'r')+'" style="width:'+o.pc+'%"></i></div><span><b>'+o.n+'/'+tot+'</b> &middot; '+o.pc+'%</span></div>'}).join("");
  var fst=$("fs").value,fa=$("fa").value,q=$("q").value.toLowerCase();
  var h='<tr><th>#</th><th>Organisasi / Tajuk Permohonan</th><th>Daerah</th>'+AGENSI.map(function(a){return '<th style="text-align:center">'+esc(a)+(has(TW,a)?'*':'')+'</th>'}).join("")+'<th>Maklum balas</th><th>Status</th></tr>';
  PERMOHONAN.forEach(function(r,i){
    var s=stat(r);
    if(fst&&s!==fst)return;if(fa&&r.daerah!==fa)return;
    if(q&&(r.nama+" "+(r.tajuk||"")).toLowerCase().indexOf(q)<0)return;
    var got=AGENSI.filter(function(a){return sv(r,a)>0}).length;
    h+='<tr><td>'+(i+1)+'</td><td><b>'+esc(r.nama)+'</b>'+(r.tajuk?'<div class="tj">'+esc(r.tajuk)+'</div>':'')+'</td><td>'+esc(r.daerah)+'</td>'+
    AGENSI.map(function(a){var v=sv(r,a);return '<td class="c s'+v+'">'+SY[v]+'</td>'}).join("")+
    '<td>'+got+'/'+AGENSI.length+(!r.keputusan&&wm(r).length?'<div class="m">Menunggu: '+esc(wm(r).join(", "))+'</div>':'')+'</td><td><span class="pill" style="color:'+ST[s][1]+'">'+ST[s][0]+'</span></td></tr>';
  });
  $("t").innerHTML=h;
}
["fs","fa"].forEach(function(i){$(i).onchange=render});$("q").oninput=render;
render();
}
</script>
</body>
</html>
